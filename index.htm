<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>宫崎英高摸鱼打酒日记</title>
    
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="game-container">
        <div id="hud">SCORE: <span id="score-val">0</span></div>
        <button id="open-lb-btn">🏆 排行榜</button>

        <canvas id="gameCanvas"></canvas>
        
        <div id="controls-hint">按住屏幕倒酒</div>

        <div id="start-screen" class="overlay">
            <h1>宫崎英高<br>摸鱼打酒日记</h1>
            <div class="subtitle">Miyazaki's Beer Pouring Diary</div>
            
            <div class="input-group">
                <input type="text" id="player-name-input" class="soul-input" placeholder="输入名字 (Enter Name)" maxlength="12">
            </div>

            <button id="start-btn" disabled>开始受苦 (START)</button>
        </div>

        <div id="result-screen" class="overlay hidden">
            <div id="result-text">YOU SPILLED</div>
            <div id="result-detail">分数: 0</div>
            <div id="upload-status" style="margin-bottom: 10px; font-size: 0.8rem; color: #666;"></div>
            
            <div class="btn-group">
                <button id="restart-btn">再次传火</button>
                <button id="check-rank-btn">查看排行</button>
            </div>
        </div>

        <div id="leaderboard-panel" class="hidden">
            <div class="lb-header">
                <span>LEGENDS (全服排行)</span>
                <span class="lb-close" onclick="closeLeaderboard()">×</span>
            </div>
            <div id="lb-content" class="lb-list">
                <div class="lb-loading">正在从服务器读取铭文...</div>
            </div>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
