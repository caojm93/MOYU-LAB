<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <title>宫崎英高摸鱼打酒日记</title>
    
    <link rel="stylesheet" href="style.css?v=3.1">
</head>
<body>

    <div id="game-container">
        <div id="hud">SCORE: <span id="score-val">0</span></div>
        
        <div style="position: absolute; top: 40px; right: 20px; z-index: 5; display: flex; gap: 10px;">
            <button id="open-lb-btn" class="hud-btn">🏆 排行榜</button>
            <button id="open-ach-btn" class="hud-btn">💀 成就</button>
        </div>

        <canvas id="gameCanvas"></canvas>
        
        <div id="controls-hint">按住屏幕倒酒</div>

        <div id="start-screen" class="overlay">
            <h1>宫崎英高<br>摸鱼打酒日记</h1>
            <div class="subtitle">Miyazaki's Beer Pouring Diary</div>
            
            <div style="font-size: 0.6rem; color: #555; margin-bottom: 15px;">Ver 3.1 (Stable)</div>
            
            <div class="input-group">
                <input type="text" id="player-name-input" class="soul-input" placeholder="输入名字 (Enter Name)" maxlength="12">
            </div>

            <button id="start-btn" disabled>开始受苦 (START)</button>
        </div>

        <div id="result-screen" class="overlay hidden">
            <div id="result-text">YOU SPILLED</div>
            <div id="result-detail">分数: 0</div>

            <div class="qr-container">
                <img src="qr.png" alt="Challenge" class="qr-code">
                <div class="qr-hint">截图分享给朋友<br>邀请他们一起受苦</div>
            </div>

            <div id="upload-status" style="margin-bottom: 5px; font-size: 0.7rem; color: #666;"></div>
            
            <div class="btn-group">
                <button id="restart-btn">再次传火</button>
                <button id="check-rank-btn">查看排行</button>
            </div>
            <button id="result-ach-btn" style="margin-top: 15px; font-size: 0.8rem; padding: 10px 20px; border-color: #555; color: #888;">查看我的成就</button>
        </div>

        <div id="leaderboard-panel" class="hidden panel-common">
            <div class="lb-header">
                <span>LEGENDS</span>
                <span class="lb-close" onclick="closePanel('leaderboard-panel')">×</span>
            </div>
            
            <div class="lb-banner">
                <div class="lb-banner-text">
                    <div style="color: var(--ui-gold); font-weight: bold; margin-bottom: 2px;">摸鱼研究所·精酿啤酒 (天河南二路店)</div>
                    <div style="color: #ccc; font-size: 0.75rem;">12.12 啜饮酿造·发行商特卖</div>
                    <div style="margin-top: 4px;">
                        <span style="color: #fff; font-weight: bold; font-size: 1rem;">¥168</span> 
                        <span style="color: #888; font-size: 0.7rem;">/ 8杯</span>
                    </div>
                    <div style="color: var(--ui-red); font-size: 0.7rem; margin-top: 2px;">[ 扫码立即购票 ]</div>
                </div>
                <img src="ticket_qr.png" alt="扫码购票" class="lb-banner-qr">
            </div>

            <div class="lb-tabs">
                <div class="lb-tab active" data-type="score" onclick="switchLb('score')">最高分 (Score)</div>
                <div class="lb-tab" data-type="count" onclick="switchLb('count')">受苦榜 (Deaths)</div>
            </div>
            <div id="lb-content" class="lb-list">
                <div class="lb-loading">正在召唤灵魂...</div>
            </div>
        </div>

        <div id="achievement-panel" class="hidden panel-common">
            <div class="lb-header">
                <span>TROPHIES</span>
                <span class="lb-close" onclick="closePanel('achievement-panel')">×</span>
            </div>
            <div class="ach-content">
                <div class="stats-box">
                    <div>当前传火者: <span id="stat-name" style="color:var(--ui-gold)">-</span></div>
                    <div>累计受苦次数: <span id="stat-count" style="color:var(--ui-red)">0</span></div>
                </div>
                <hr style="border-color:#333; margin: 10px 0;">
                <div id="ach-list"></div>
            </div>
        </div>
        
        <div id="ach-toast">
            <div class="ach-icon">🏆</div>
            <div class="ach-info">
                <div class="ach-title">成就解锁</div>
                <div class="ach-name" id="toast-name"></div>
            </div>
        </div>
    </div>

    <script src="game.js?v=3.1"></script>
</body>
</html>
